<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Disk Space Analyzer</title>
</head>

<body>

<h2>Disk Space Analyzer</h2>

<button id="scanBtn">Analyze Folder</button>

<p><b></b> <span id="joke"></span></p>

<table border="1">
    <thead>
        <tr>
            <th>File Name</th>
            <th>Size</th>
        </tr>
    </thead>

    <tbody id="resultBody"></tbody>
</table>

<script>
function updateLargeFileView(files){

    const tbody = document.getElementById("resultBody");
    tbody.innerHTML = "";

    for(const file of files){

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${file.name}</td>
            <td>${file.size_formatted}</td>
        `;

        tbody.appendChild(row);
    }

}

function displayJoke(joke){
    document.getElementById("joke").textContent = joke;
}
</script>
</body>
</html>
