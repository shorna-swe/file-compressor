<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File Compressor</title>
</head>

<body>

    <h1 id="clock"></h1>
    <h1>File Compressor</h1>

    <div>

        <button id="choose-folder">
            Select Folder
        </button>

    </div>

    <br>

    <div>

        <button id="compress">
            Compress
        </button>

        <span id="output">
            Output: source.zip
        </span>

    </div>

    <br>

    <div>

        <progress
            id="progress"
            value="0"
            max="100"
        ></progress>

        <span id="progress-text">
            0%
        </span>

    </div>
    <script>

        async function loadCompressionProgress(progress) {
            document.getElementById("progress").value =
                progress.percentage;

            document.getElementById("progress-text").textContent =
                `${progress.percentage.toFixed(2)}% ` +
                `(${progress.files} / ${progress.totalFiles} files)`;

            document.getElementById("output").innerText = progress.destination;
        }


    </script>

    <script src="renderer.js"></script>

</body>

</html>
